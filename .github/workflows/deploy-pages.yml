name: Deploy demo (GitHub Pages, modo replay)

# Publica la demo sin key ni backend: las llamadas a modelos salen de
# public/replays/muse-spark.json (npm run replays:record). Requiere activar una vez
# Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa
      - name: Build en modo replay
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_MODEL_MODE: replay
      - name: Sin secretos en dist
        run: |
          if grep -rlE "MODEL_API_KEY|GLIMMER_API_KEY" dist; then
            echo "dist contiene nombres de variables secretas" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
